<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <link rel="manifest" href="site.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    
    <title>CanvasPRO 2.1 - Cetak Profesional</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; background: #0a0a0a; font-family: 'Segoe UI', Arial, sans-serif; }
        body { display: flex; justify-content: center; align-items: flex-start; padding: 10px; }
        .container { background: white; padding: 0; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-width: 1100px; width: 100%; }
        .header-title { 
            text-align: center; 
            padding: 12px 0 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header-title .logo {
            height: 30px;
            width: 30px;
            vertical-align: middle;
        }
        .header-title .title-text {
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 700;
        }
        .header-title .title-text .canvas-red {
            color: #CC0000;
        }
        .header-title .title-text .pro-blue {
            color: #1565C0;
        }
        .header-title .title-text .version-dark {
            color: #1a1a1a;
            font-size: clamp(12px, 1.5vw, 18px);
            font-weight: 400;
        }
        .canvas-wrapper { position: relative; background: #ffffff; border-radius: 10px; overflow: hidden; width: 100%; }
        canvas { display: block; width: 100%; height: auto; background: #ffffff; }
        .click-overlay { 
            position: absolute; 
            border-radius: 24px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            z-index: 10; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .click-overlay:hover { 
            background: rgba(0,0,0,0.05); 
        }
        .click-overlay .tooltip { 
            background: rgba(0,0,0,0.7); 
            color: white; 
            font-size: 13px; 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: 500; 
            pointer-events: none; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            white-space: nowrap; 
            font-family: 'Segoe UI', Arial, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .click-overlay:hover .tooltip { 
            opacity: 1; 
        }
        .click-overlay.empty .tooltip { 
            opacity: 1; 
        }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 8px 0; justify-content: center; align-items: flex-end; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 12px 0 8px 0; padding: 0 15px; }
        .btn { padding: 10px 24px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s; color: white; display: inline-flex; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.95); }
        .btn-download { background: linear-gradient(135deg, #1565C0 0%, #0D47A1 100%); box-shadow: 0 4px 15px rgba(21,101,192,0.3); }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(21,101,192,0.5); }
        .btn-reset { background: #757575; padding: 10px 20px; }
        .btn-reset:hover { background: #616161; transform: translateY(-2px); }
        .btn-install { background: linear-gradient(135deg, #CC0000 0%, #25D366 100%); padding: 10px 24px; }
        .btn-install:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(204,0,0,0.5); }
        .btn-install.hidden { display: none !important; }
        .btn-update { background: linear-gradient(135deg, #FFA000 0%, #FF6F00 100%); padding: 10px 24px; }
        .btn-update:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,160,0,0.5); }
        .btn-update.hidden { display: none !important; }
        .version { text-align: center; font-size: 11px; color: #999; margin-top: 4px; padding: 0 15px 10px 15px; }
        .developer { text-align: center; font-size: 10px; color: #bbb; margin-top: 2px; letter-spacing: 0.5px; padding: 0 15px 15px 15px; }
        .developer span { color: #888; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a237e; color: white; padding: 10px 24px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,0.4); z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; text-align: center; }
        .toast.show { opacity: 1; }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #c62828; }
        .toast.info { background: #00695c; }
        .toast.warning { background: #e65100; }
        #multiInput { display: none; }

        /* ===== CONTEXT MENU ===== */
        .context-menu {
            position: fixed;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            padding: 6px 0;
            min-width: 200px;
            z-index: 9999;
            display: none;
            border: 1px solid #e0e0e0;
        }
        .context-menu.show {
            display: block;
        }
        .context-menu-item {
            padding: 8px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #333;
            transition: background 0.2s;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .context-menu-item:hover {
            background: #f0f0f0;
        }
        .context-menu-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        .context-menu-item .shortcut {
            margin-left: auto;
            color: #999;
            font-size: 11px;
        }
        .context-menu-divider {
            height: 1px;
            background: #e0e0e0;
            margin: 4px 8px;
        }

        @media (max-width: 600px) {
            body { padding: 5px; }
            .container { padding: 10px; border-radius: 8px; }
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; justify-content: center; padding: 12px 20px; }
            .click-overlay .tooltip { font-size: 10px; padding: 4px 12px; }
            .context-menu { min-width: 160px; }
            .context-menu-item { font-size: 12px; padding: 6px 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- JUDUL DENGAN WARNA: Canvas MERAH, Pro BIRU, 2.1 HITAM GELAP -->
    <div class="header-title">
        <img src="icons/favicon-32x32.png" alt="CanvasPRO" class="logo" />
        <span class="title-text">
            <span class="canvas-red">Canvas</span><span class="pro-blue">Pro</span> <span class="version-dark">2.1</span>
        </span>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="mainCanvas" width="2400" height="1350"></canvas>
    </div>

    <input type="file" id="multiInput" accept="image/*" multiple />

    <div class="btn-group" id="btnGroup">
        <button class="btn btn-download" id="downloadBtn">⬇️ Download PNG</button>
        <button class="btn btn-reset" id="resetBtn">🔄 Reset</button>
        <button class="btn btn-install" id="installBtn">📲 Install Aplikasi</button>
        <button class="btn btn-update hidden" id="updateBtn">🔄 Update Aplikasi</button>
    </div>
	
    <div class="developer">Developer: <span>Kodim 1609/Buleleng</span>Koramil 05/Sukasada</div>
    <div class="version">CanvasPRO 2.1 • © 2026</div>
</div>

<!-- ===== CONTEXT MENU ===== -->
<div class="context-menu" id="contextMenu">
    <div class="context-menu-item" id="menuPaste">
        <span class="icon">📋</span>
        <span>Tempel</span>
        <span class="shortcut">Ctrl+V</span>
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" id="menuReset">
        <span class="icon">🔄</span>
        <span>Reset Gambar</span>
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" id="menuDownload">
        <span class="icon">⬇️</span>
        <span>Download</span>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    (function() {
        'use strict';

        // ============================================
        //  CANVAS SETUP
        // ============================================
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvasWrapper');

        const W = 2400;
        const H = 1080;
        canvas.width = W;
        canvas.height = H;

        const border = 50;
        const gap = 25;
        const imgWidth = (W - (border * 2) - gap) / 2;
        const imgHeight = 700;
        const leftImageOffset = -20;
        const rightImageOffset = 20;
        const imgX = border + leftImageOffset;
        const imgX2 = border + imgWidth + gap + rightImageOffset;
        
        const headerHeight = 250;
        const headerY = 20;
        const headerX = border + leftImageOffset;
        const headerW = (2 * imgWidth) + gap + rightImageOffset - leftImageOffset;
        const headerGap = 40;
        
        const imgY = headerY + headerHeight + headerGap;

        const cornerRadius = 24;
        const lineWidth = 8;

        let imgHeader = null;
        let imgLeft = null;
        let imgRight = null;
        let isRendering = false;
        let contextTarget = 'left';

        const multiInput = document.getElementById('multiInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const installBtn = document.getElementById('installBtn');
        const updateBtn = document.getElementById('updateBtn');
        const toast = document.getElementById('toast');

        // Context Menu Elements
        const contextMenu = document.getElementById('contextMenu');
        const menuPaste = document.getElementById('menuPaste');
        const menuReset = document.getElementById('menuReset');
        const menuDownload = document.getElementById('menuDownload');

        let overlayLeft = null;
        let overlayRight = null;
        let toastTimeout;
        let deferredPrompt = null;

        // ============================================
        //  TOAST NOTIFICATION
        // ============================================
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================
        //  CONTEXT MENU - KLIK KANAN
        // ============================================
        function showContextMenu(e, target) {
            e.preventDefault();
            e.stopPropagation();
            contextTarget = target;
            
            contextMenu.style.left = e.clientX + 'px';
            contextMenu.style.top = e.clientY + 'px';
            contextMenu.classList.add('show');
            
            console.log('📋 Context menu untuk:', target);
        }

        function hideContextMenu() {
            contextMenu.classList.remove('show');
        }

        // ============================================
        //  PASTE HANDLER
        // ============================================
        function handlePasteFromClipboard() {
            console.log('📋 Mencoba paste ke:', contextTarget);
            
            if (navigator.clipboard && navigator.clipboard.read) {
                navigator.clipboard.read()
                    .then(items => {
                        let imageFound = false;
                        for (let item of items) {
                            const imageTypes = ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/bmp'];
                            for (let type of imageTypes) {
                                if (item.types.includes(type)) {
                                    item.getType(type).then(blob => {
                                        const file = new File([blob], 'pasted-image.png', { type: blob.type });
                                        loadPastedImage(file);
                                        imageFound = true;
                                    }).catch(err => {
                                        console.log('Gagal get type:', err);
                                    });
                                    break;
                                }
                            }
                            if (imageFound) break;
                        }
                        if (!imageFound) {
                            showToast('⚠️ Tidak ada gambar di clipboard', 'warning');
                        }
                    })
                    .catch(err => {
                        console.log('Gagal baca clipboard:', err);
                        showToast('⚠️ Gagal akses clipboard. Coba Ctrl+V', 'warning');
                    });
            } else {
                showToast('⚠️ Browser tidak support clipboard API. Coba Ctrl+V', 'warning');
            }
        }

        async function loadPastedImage(file) {
            try {
                console.log('📷 Memuat gambar untuk area:', contextTarget);
                const img = await loadImageFromFile(file);
                const target = contextTarget || 'left';
                
                if (target === 'left') {
                    imgLeft = img;
                    showToast('✅ Gambar di-paste ke area KIRI!', 'success');
                    console.log('✅ Gambar KIRI berhasil di-paste');
                } else {
                    imgRight = img;
                    showToast('✅ Gambar di-paste ke area KANAN!', 'success');
                    console.log('✅ Gambar KANAN berhasil di-paste');
                }
                renderCanvas();
                hideContextMenu();
            } catch (err) {
                console.error('❌ Error paste:', err);
                showToast('❌ Gagal paste gambar: ' + err, 'error');
            }
        }

        // ============================================
        //  EVENT PASTE CTRL+V
        // ============================================
        document.addEventListener('paste', function(e) {
            const target = e.target;
            if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) {
                return;
            }
            
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;

            let imageFile = null;
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (item.type.startsWith('image/')) {
                    imageFile = item.getAsFile();
                    break;
                }
            }

            if (imageFile) {
                e.preventDefault();
                console.log('📷 Ctrl+V: Gambar terdeteksi, target:', contextTarget);
                loadPastedImage(imageFile);
            }
        });

        // ============================================
        //  CREATE CLICK OVERLAYS
        // ============================================
        function createOverlays() {
            if (overlayLeft) overlayLeft.remove();
            if (overlayRight) overlayRight.remove();

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const leftX_px = imgX / scaleX;
            const leftY_px = imgY / scaleY;
            const leftW_px = imgWidth / scaleX;
            const leftH_px = imgHeight / scaleY;
            const rightX_px = imgX2 / scaleX;

            // ========== OVERLAY KIRI ==========
            overlayLeft = document.createElement('div');
            overlayLeft.className = 'click-overlay';
            overlayLeft.style.left = leftX_px + 'px';
            overlayLeft.style.top = leftY_px + 'px';
            overlayLeft.style.width = leftW_px + 'px';
            overlayLeft.style.height = leftH_px + 'px';
            overlayLeft.style.borderRadius = (cornerRadius / scaleX) + 'px';

            const t1 = document.createElement('span');
            t1.className = 'tooltip';
            t1.textContent = '📷 Klik atau Klik Kanan';
            overlayLeft.appendChild(t1);

            overlayLeft.addEventListener('click', (e) => {
                e.stopPropagation();
                contextTarget = 'left';
                multiInput.dataset.target = 'left';
                multiInput.click();
                console.log('🖱️ Click kiri - target: left');
            });

            overlayLeft.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                showContextMenu(e, 'left');
            });

            overlayLeft.addEventListener('mouseenter', () => {
                contextTarget = 'left';
            });

            canvasWrapper.appendChild(overlayLeft);

            // ========== OVERLAY KANAN ==========
            overlayRight = document.createElement('div');
            overlayRight.className = 'click-overlay';
            overlayRight.style.left = rightX_px + 'px';
            overlayRight.style.top = leftY_px + 'px';
            overlayRight.style.width = leftW_px + 'px';
            overlayRight.style.height = leftH_px + 'px';
            overlayRight.style.borderRadius = (cornerRadius / scaleX) + 'px';

            const t2 = document.createElement('span');
            t2.className = 'tooltip';
            t2.textContent = '📷 Klik atau Klik Kanan';
            overlayRight.appendChild(t2);

            overlayRight.addEventListener('click', (e) => {
                e.stopPropagation();
                contextTarget = 'right';
                multiInput.dataset.target = 'right';
                multiInput.click();
                console.log('🖱️ Click kanan - target: right');
            });

            overlayRight.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                showContextMenu(e, 'right');
            });

            overlayRight.addEventListener('mouseenter', () => {
                contextTarget = 'right';
            });

            canvasWrapper.appendChild(overlayRight);
        }

        function updateOverlays() {
            if (!overlayLeft || !overlayRight) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const leftX_px = imgX / scaleX;
            const leftY_px = imgY / scaleY;
            const leftW_px = imgWidth / scaleX;
            const leftH_px = imgHeight / scaleY;
            const rightX_px = imgX2 / scaleX;

            overlayLeft.style.left = leftX_px + 'px';
            overlayLeft.style.top = leftY_px + 'px';
            overlayLeft.style.width = leftW_px + 'px';
            overlayLeft.style.height = leftH_px + 'px';
            overlayLeft.style.borderRadius = (cornerRadius / scaleX) + 'px';

            overlayRight.style.left = rightX_px + 'px';
            overlayRight.style.top = leftY_px + 'px';
            overlayRight.style.width = leftW_px + 'px';
            overlayRight.style.height = leftH_px + 'px';
            overlayRight.style.borderRadius = (cornerRadius / scaleX) + 'px';

            if (!imgLeft) {
                overlayLeft.classList.add('empty');
            } else {
                overlayLeft.classList.remove('empty');
            }
            if (!imgRight) {
                overlayRight.classList.add('empty');
            } else {
                overlayRight.classList.remove('empty');
            }
        }

        // ============================================
        //  CONTEXT MENU ITEMS
        // ============================================
        menuPaste.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('📋 Menu Paste diklik, target:', contextTarget);
            handlePasteFromClipboard();
        });

        menuReset.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('🔄 Menu Reset diklik, target:', contextTarget);
            if (contextTarget === 'left') {
                imgLeft = null;
                showToast('🔄 Gambar kiri direset', 'info');
            } else {
                imgRight = null;
                showToast('🔄 Gambar kanan direset', 'info');
            }
            renderCanvas();
            hideContextMenu();
        });

        menuDownload.addEventListener('click', (e) => {
            e.stopPropagation();
            downloadPNG();
            hideContextMenu();
        });

        document.addEventListener('click', hideContextMenu);
        document.addEventListener('scroll', hideContextMenu);

        // ============================================
        //  LOAD HEADER
        // ============================================
        async function loadHeader() {
            try {
                console.log('🔍 Mencari header di folder header/ ...');
                const possibleFiles = ['header.png', 'header-1.png', 'header.jpg'];
                for (const file of possibleFiles) {
                    try {
                        const imgResponse = await fetch(`./header/${file}`);
                        if (imgResponse.ok) {
                            const blob = await imgResponse.blob();
                            const url = URL.createObjectURL(blob);
                            const img = new Image();
                            img.onload = () => {
                                console.log(`✅ Header berhasil dimuat: ${file}`);
                                imgHeader = img;
                                renderCanvas();
                                showToast(`✅ Header: ${file}`, 'success');
                            };
                            img.onerror = () => {};
                            img.src = url;
                            return;
                        }
                    } catch (e) { /* skip */ }
                }
                console.warn('⚠️ Tidak ada header di folder header/');
                showToast('⚠️ Tidak ada header di folder header/', 'warning');
                renderCanvas();
            } catch (error) {
                console.error('❌ Error loading header:', error);
                showToast('⚠️ Gagal load header', 'warning');
                renderCanvas();
            }
        }

        function drawImageStretch(ctx, img, dx, dy, dw, dh) {
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, dx, dy, dw, dh);
        }

        function roundRect(ctx, x, y, w, h, r) {
            if (ctx.roundRect) {
                ctx.roundRect(x, y, w, h, r);
            } else {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }
        }

        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject('Gagal decode gambar');
                    img.src = e.target.result;
                };
                reader.onerror = () => reject('Gagal baca file');
                reader.readAsDataURL(file);
            });
        }

        // ============================================
        //  RENDER CANVAS
        // ============================================
        function renderCanvas() {
            if (isRendering) return;
            isRendering = true;

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, W, H);

            if (imgHeader) {
                ctx.save();
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(imgHeader, headerX, headerY, headerW, headerHeight);
                ctx.restore();
            } else {
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(headerX, headerY, headerW, headerHeight);
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 8]);
                ctx.strokeRect(headerX, headerY, headerW, headerHeight);
                ctx.setLineDash([]);
                ctx.fillStyle = '#999999';
                ctx.font = '32px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📁 Taruh file PNG di folder header/', headerX + headerW / 2, headerY + headerHeight / 2);
            }

            const leftX = imgX;
            const leftY = imgY;
            const leftW = imgWidth;
            const leftH = imgHeight;
            const rightX = imgX2;

            if (imgLeft) {
                ctx.save();
                roundRect(ctx, leftX, leftY, leftW, leftH, cornerRadius);
                ctx.clip();
                drawImageStretch(ctx, imgLeft, leftX, leftY, leftW, leftH);
                ctx.restore();

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                const strokeOffset = lineWidth / 2;
                roundRect(ctx, leftX + strokeOffset, leftY + strokeOffset, leftW - lineWidth, leftH - lineWidth, cornerRadius);
                ctx.stroke();
            } else {
                ctx.save();
                roundRect(ctx, leftX, leftY, leftW, leftH, cornerRadius);
                ctx.clip();
                ctx.fillStyle = '#f5f5f5';
                ctx.fillRect(leftX, leftY, leftW, leftH);
                ctx.restore();
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 6]);
                roundRect(ctx, leftX, leftY, leftW, leftH, cornerRadius);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📷', leftX + leftW / 2, leftY + leftH / 2);
            }

            if (imgRight) {
                ctx.save();
                roundRect(ctx, rightX, leftY, leftW, leftH, cornerRadius);
                ctx.clip();
                drawImageStretch(ctx, imgRight, rightX, leftY, leftW, leftH);
                ctx.restore();

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                const strokeOffset = lineWidth / 2;
                roundRect(ctx, rightX + strokeOffset, leftY + strokeOffset, leftW - lineWidth, leftH - lineWidth, cornerRadius);
                ctx.stroke();
            } else {
                ctx.save();
                roundRect(ctx, rightX, leftY, leftW, leftH, cornerRadius);
                ctx.clip();
                ctx.fillStyle = '#f5f5f5';
                ctx.fillRect(rightX, leftY, leftW, leftH);
                ctx.restore();
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 6]);
                roundRect(ctx, rightX, leftY, leftW, leftH, cornerRadius);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📷', rightX + leftW / 2, leftY + leftH / 2);
            }

            isRendering = false;
            setTimeout(updateOverlays, 50);
        }

        function downloadPNG() {
            try {
                let downloadCounter = parseInt(localStorage.getItem('lapsitDownloadCounter') || '0') + 1;
                localStorage.setItem('lapsitDownloadCounter', downloadCounter.toString());
                
                const link = document.createElement('a');
                link.download = `lapsit_${downloadCounter}.png`;
                link.href = canvas.toDataURL('image/png');
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                const filename = `lapsit_${downloadCounter}.png`;
                showToast(`✅ Download ${filename} selesai!`, 'success');
                alert(`✅ File ${filename} berhasil didownload!\n\nFile tersimpan di folder Downloads.\n\nSilakan cek folder Downloads Anda.`);
            } catch (e) {
                showToast('❌ Gagal download: ' + e.message, 'error');
                alert('❌ Gagal download: ' + e.message);
            }
        }

        function resetAll() {
            imgLeft = null;
            imgRight = null;
            multiInput.value = '';
            renderCanvas();
            showToast('🔄 Semua gambar direset, header tetap!', 'info');
        }

        // ============================================
        //  HYBRID MULTI-SELECT HANDLER
        // ============================================
        multiInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            const target = multiInput.dataset.target || 'left';
            
            if (files && files.length > 0) {
                try {
                    const file1 = files[0] || null;
                    const file2 = files[1] || null;
                    
                    if (files.length === 1) {
                        if (file1) {
                            const img = await loadImageFromFile(file1);
                            if (target === 'left') {
                                imgLeft = img;
                                showToast(`✅ 1 gambar dimuat ke area KIRI`, 'success');
                            } else {
                                imgRight = img;
                                showToast(`✅ 1 gambar dimuat ke area KANAN`, 'success');
                            }
                        }
                    } else {
                        if (file1) {
                            imgLeft = await loadImageFromFile(file1);
                        }
                        if (file2) {
                            imgRight = await loadImageFromFile(file2);
                        }
                        showToast(`✅ 2 gambar dimuat! KIRI & KANAN terisi`, 'success');
                    }
                    
                    renderCanvas();
                    
                } catch (err) {
                    showToast('❌ Gagal load gambar: ' + err, 'error');
                }
            }
            multiInput.value = '';
            multiInput.dataset.target = 'left';
        });

        downloadBtn.addEventListener('click', downloadPNG);
        resetBtn.addEventListener('click', resetAll);

        // ============================================
        //  PWA INSTALL LOGIC
        // ============================================
        function isAppInstalled() {
            if (window.matchMedia('(display-mode: standalone)').matches) return true;
            if (window.navigator.standalone === true) return true;
            if (localStorage.getItem('app_installed') === 'true') return true;
            return false;
        }

        function hideInstallButton() {
            installBtn.classList.add('hidden');
        }

        function showInstallButton() {
            installBtn.classList.remove('hidden');
        }

        (function checkInstallStatus() {
            if (isAppInstalled()) {
                hideInstallButton();
            } else {
                installBtn.classList.add('hidden');
            }
        })();

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!isAppInstalled()) {
                showInstallButton();
                showToast('📲 Klik "Install Aplikasi" untuk install', 'info');
            } else {
                hideInstallButton();
            }
        });

        window.addEventListener('appinstalled', () => {
            localStorage.setItem('app_installed', 'true');
            hideInstallButton();
            deferredPrompt = null;
            showToast('✅ Aplikasi berhasil diinstall!', 'success');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    // Will be handled by appinstalled event
                } else {
                    showToast('❌ Install dibatalkan', 'warning');
                    if (!isAppInstalled()) {
                        showInstallButton();
                    }
                }
                deferredPrompt = null;
            } else {
                showToast('⚠️ Install tidak tersedia saat ini', 'warning');
            }
        });

        // ============================================
        //  SERVICE WORKER & UPDATE
        // ============================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then((registration) => {
                    console.log('✅ Service Worker registered');
                    setInterval(() => {
                        registration.update();
                    }, 30000);
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                if (isAppInstalled()) {
                                    updateBtn.classList.remove('hidden');
                                    installBtn.classList.add('hidden');
                                    showToast('🔄 Update tersedia! Klik tombol Update.', 'info');
                                } else {
                                    showToast('🔄 Update tersedia! Halaman akan refresh...', 'info');
                                    setTimeout(() => window.location.reload(), 2000);
                                }
                            }
                        });
                    });
                })
                .catch((err) => console.log('❌ Service Worker failed:', err));
        }

        updateBtn.addEventListener('click', () => window.location.reload());

        // ============================================
        //  RESIZE
        // ============================================
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(updateOverlays, 200);
        });

        // ============================================
        //  INIT
        // ============================================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        async function init() {
            await loadHeader();
            renderCanvas();
            setTimeout(() => {
                createOverlays();
                updateOverlays();
            }, 100);
            
            if (isAppInstalled()) {
                hideInstallButton();
            }
            
            showToast('🖨️ CanvasPRO 2.1 - HYBRID MULTI siap!', 'success');
            console.log('✅ CanvasPRO 2.1 - HYBRID MULTI siap!');
            console.log('📱 Status install:', isAppInstalled() ? 'Sudah terinstall ✅' : 'Belum terinstall ❌');
            console.log('🖱️ Klik kanan di area kiri atau kanan untuk menu context');
            console.log('📋 Paste: Klik kanan → Tempel atau Ctrl+V');
        }

        init();
    })();
</script>
